<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRE | S3 Static Hosting Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 40px 60px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 2.2rem; color: #00d4ff; margin-bottom: 10px; }
    p { color: #ccc; font-size: 1rem; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 16px;
      background: #00d4ff22;
      border: 1px solid #00d4ff;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #00d4ff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 TASK-1: S3 Static Hosting</h1>
    <p>This page is served directly from an AWS S3 bucket.</p>
    <p>Deployed and managed by an aspiring SRE.</p>
    <span class="badge">Status: Live</span>
  </div>
</body>
</html>
