<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMart - 24/7 Electronics Shopping</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f1117;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 50px 70px;
      border-radius: 14px;
    }
    h1 { font-size: 2.4rem; color: #ff9900; margin-bottom: 12px; }
    p { color: #ccc; font-size: 1.05rem; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 18px;
      background: #ff990022;
      border: 1px solid #ff9900;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #ff9900;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛒 TechMart</h1>
    <p>24/7 Electronics Shopping</p>
    <p>Running on AWS EC2 — monitored by CloudWatch</p>
    <span class="badge">Server: Live</span>
  </div>
</body>
</html>
