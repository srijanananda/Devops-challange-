<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMart Mobile API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1b2a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 50px 70px;
      border-radius: 14px;
    }
    h1 { font-size: 2.2rem; color: #00e5ff; margin-bottom: 12px; }
    p { color: #ccc; font-size: 1rem; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 18px;
      background: #00e5ff22;
      border: 1px solid #00e5ff;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #00e5ff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 TechMart Mobile API</h1>
    <p>Serving 24/7 Tech Solutions</p>
    <p>Running in a Docker container on ECS Fargate</p>
    <span class="badge">Container: Live</span>
  </div>
</body>
</html>
